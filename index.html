}
function rCart(){
  const items=Object.entries(cart).map(([id,q])=>({...IM[id],q}));
  const t=ct();
  return `<div class="overlay" onclick="if(event.target.className==='overlay'){co=false;rC()}"><div class="sheet"><div class="handle"></div><h2 style="font-size:18px;font-weight:700;margin-bottom:16px">🛒 Votre commande — Table ${TBL}</h2>${items.map(i=>`<div class="cart-item"><div><div style="font-size:14px;font-weight:600">${i.name}</div><div style="font-size:12px;color:#888">x${i.q} × ${i.price.toFixed(2)} €</div></div><div style="display:flex;align-items:center;gap:8px"><button class="qbtn" onclick="rem('${i.id}')" style="width:26px;height:26px;font-size:14px">−</button><span style="font-size:14px;font-weight:700">${i.q}</span><button class="qbtn p" onclick="add('${i.id}')" style="width:26px;height:26px;font-size:14px">+</button><span style="font-size:14px;font-weight:700;color:#C0392B;min-width:50px;text-align:right">${(i.price*i.q).toFixed(2)} €</span></div></div>`).join('')}<div class="cart-total"><span>Total</span><span>${t.toFixed(2)} €</span></div><textarea rows="2" placeholder="Remarques (allergies, cuisson, sans oignon...)" onchange="note=this.value">${note}</textarea><button class="obtn" onclick="subOrder()" id="ob">Envoyer la commande →</button></div></div>`;
}
async function subOrder(){
  const b=document.getElementById('ob');if(b){b.disabled=true;b.textContent='Envoi...';}
  const items=Object.entries(cart).map(([id,q])=>({id,q}));
  const total=Math.round(ct()*100)/100;
  const{error}=await SB.from('orders').insert([{id:`CMD-${Date.now()}`,table_num:TBL,status:'nouveau',items,note,total}]);
  if(!error){cart={};note='';co=false;done=true;rC();}
  else{if(b){b.disabled=false;b.textContent='Envoyer la commande →';}alert('Erreur, réessayez.');}
}
async function loadStaff(){
  const el=document.getElementById('sv');
  el.innerHTML='<div style="text-align:center;padding:40px;color:#888">Chargement...</div>';
  const{data}=await SB.from('orders').select('*').order('created_at',{ascending:false});
  orders=data||[];rS();
  if(ch)SB.removeChannel(ch);
  ch=SB.channel('rt').on('postgres_changes',{event:'*',schema:'public',table:'orders'},p=>{
    if(p.eventType==='INSERT'){orders.unshift(p.new);showAl();}
    else if(p.eventType==='UPDATE')orders=orders.map(o=>o.id===p.new.id?p.new:o);
    else if(p.eventType==='DELETE')orders=orders.filter(o=>o.id!==p.old.id);
    rS();
  }).subscribe();
}
function showAl(){const a=document.getElementById('ab');a.style.display='block';setTimeout(()=>a.style.display='none',4000);}
async function updSt(id,s){await SB.from('orders').update({status:s}).eq('id',id);}
async function archOr(id){await SB.from('orders').delete().eq('id',id);}
function rS(){
  const el=document.getElementById('sv');
  const cn={n:orders.filter(o=>o.status==='nouveau').length,e:orders.filter(o=>o.status==='en-cours').length,p:orders.filter(o=>o.status==='pret').length};
  el.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><div><div style="font-size:17px;font-weight:800">Commandes en cours</div><div style="font-size:12px;color:#888">Pitta-Snack Istanbul — Dour</div></div><div style="display:flex;align-items:center;gap:6px;color:#16a34a;font-size:13px;font-weight:600"><span class="dot"></span>Live</div></div>
  <div class="stats"><div class="stat" style="background:#fdecea"><div style="font-size:26px;font-weight:800;color:#C0392B">${cn.n}</div><div style="font-size:10px;font-weight:600;color:#C0392B;margin-top:2px">Nouvelles</div></div><div class="stat" style="background:#fef3c7"><div style="font-size:26px;font-weight:800;color:#d97706">${cn.e}</div><div style="font-size:10px;font-weight:600;color:#d97706;margin-top:2px">En prép.</div></div><div class="stat" style="background:#dcfce7"><div style="font-size:26px;font-weight:800;color:#16a34a">${cn.p}</div><div style="font-size:10px;font-weight:600;color:#16a34a;margin-top:2px">Prêtes</div></div></div>
  ${orders.length===0?'<div class="empty"><div style="font-size:40px;margin-bottom:10px">🍽️</div><div>Aucune commande pour l\'instant</div><div style="font-size:12px;margin-top:4px;color:#bbb">Les commandes apparaîtront ici en temps réel</div></div>':''}
  ${orders.map(o=>{
    const bc={nouveau:'#C0392B','en-cours':'#d97706',pret:'#16a34a'}[o.status]||'#ccc';
    const b={nouveau:{bg:'#fdecea',c:'#922b21',l:'🔴 Nouveau'},'en-cours':{bg:'#fef3c7',c:'#92400e',l:'🟡 En préparation'},pret:{bg:'#dcfce7',c:'#166534',l:'🟢 Prête'}}[o.status]||{bg:'#eee',c:'#666',l:o.status};
    const t=new Date(o.created_at).toLocaleTimeString('fr-BE',{hour:'2-digit',minute:'2-digit'});
    return `<div class="ocard" style="border-left:4px solid ${bc}"><div class="ohead"><div><div style="font-size:15px;font-weight:700">Table ${o.table_num} <span style="color:#aaa;font-weight:400;font-size:12px">— ${String(o.id).slice(-8)}</span></div><div style="font-size:12px;color:#888">⏱ ${t}</div></div><div class="sbadge" style="background:${b.bg};color:${b.c}">${b.l}</div></div>
    <div class="oitems">${o.items.map(it=>{const item=IM[it.id];return item?`<div class="oline"><span>${it.qty||it.q}× ${item.name}</span><span style="color:#888">${(item.price*(it.qty||it.q)).toFixed(2)} €</span></div>`:''}).join('')}${o.note?`<div class="onote">💬 ${o.note}</div>`:''}</div>
    <div class="ofoot"><div style="font-size:14px;font-weight:700">Total : ${Number(o.total).toFixed(2)} €</div><div>${o.status==='nouveau'?`<button class="abtn" style="background:#d97706" onclick="updSt('${o.id}','en-cours')">Accepter ✓</button>`:''}${o.status==='en-cours'?`<button class="abtn" style="background:#16a34a" onclick="updSt('${o.id}','pret')">Prêt 🔔</button>`:''}${o.status==='pret'?`<button class="abtn" style="background:#6b7280" onclick="archOr('${o.id}')">Archiver</button>`:''}</div></div></div>`;
  }).join('')}`;
}
rC();
</script>
</body>
</html>
